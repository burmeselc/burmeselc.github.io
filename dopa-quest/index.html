:root{--bg:#050713;--panel:#10162aee;--panel2:#171e36;--text:#f8f9ff;--muted:#96a0bb;--cyan:#45edff;--pink:#ff48d2;--vio:#8b6cff;--gold:#ffd66b;--ok:#59f0a2;--bad:#ff5d75;--orange:#ff9a52;--line:#26304d;--shadow:0 18px 60px #0008}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{min-height:100%;background:radial-gradient(circle at 20% -10%,#2d0d3f 0,transparent 38%),radial-gradient(circle at 90% 10%,#0a3844 0,transparent 35%),var(--bg);color:var(--text)}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}.app{max-width:780px;margin:auto;padding:calc(10px + env(safe-area-inset-top)) 12px calc(30px + env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.brand{display:flex;gap:9px;align-items:center}.logo{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-weight:1000;color:#070814;background:conic-gradient(from 220deg,var(--pink),var(--vio),var(--cyan),var(--gold),var(--pink));box-shadow:0 0 30px #8b6cff66;transform:rotate(-4deg)}h1{font-size:18px;margin:0;letter-spacing:.8px}.subtitle{font-size:9px;color:var(--muted);letter-spacing:1.2px}.pill{border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:10px;background:#10172bcc}.panel{background:linear-gradient(160deg,#131a30f5,#0b1020f5);border:1px solid var(--line);border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);backdrop-filter:blur(14px)}.hidden{display:none!important}.hudrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}.lvl{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--cyan) var(--p,0%),#202943 0);position:relative}.lvl:after{content:"";position:absolute;inset:4px;background:#0e1426;border-radius:50%}.lvl b{z-index:1;font-size:13px}.small{font-size:9px;color:var(--muted)}.bar{height:7px;background:#080b15;border-radius:999px;overflow:hidden;border:1px solid #ffffff0b}.bar>div{height:100%;background:linear-gradient(90deg,var(--vio),var(--cyan));transition:.25s}.money{text-align:right}.money b{color:var(--gold)}.questgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.quest{background:#0b1020;border:1px solid #202a47;border-radius:12px;padding:7px}.quest b{font-size:10px}.quest span{display:block;font-size:8px;color:var(--muted);margin-top:2px}.quest.done{border-color:#5bf0a266;box-shadow:inset 0 0 16px #59f0a211}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}.tab{border:1px solid var(--line);background:#11172b;color:var(--muted);padding:9px 4px;border-radius:12px;font-size:10px;font-weight:800}.tab.active{color:#070914;border-color:transparent;background:linear-gradient(100deg,var(--pink),var(--cyan));box-shadow:0 0 20px #8b6cff44}.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:block;font-size:9px;color:var(--muted);margin:0 0 5px 2px}select{width:100%;appearance:none;border:1px solid var(--line);background:#12192e;color:var(--text);padding:11px;border-radius:13px}.wide{grid-column:1/-1}.primary,.secondary{border:0;border-radius:15px;padding:13px;font-weight:900;color:white}.primary{background:linear-gradient(105deg,var(--pink),var(--vio) 50%,var(--cyan));box-shadow:0 10px 28px #8b6cff44}.secondary{background:#171f37;border:1px solid var(--line)}.zonebox{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.zone{border:1px solid var(--line);background:#0d1325;border-radius:12px;padding:8px;text-align:center}.zone b{font-size:13px}.zone span{display:block;color:var(--muted);font-size:8px}.zone .mini{height:4px;background:#070a13;border-radius:999px;overflow:hidden;margin-top:5px}.zone .mini>div{height:100%;background:linear-gradient(90deg,var(--pink),var(--cyan))}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}.stat{background:#10162a  #0008}.prompt.jp{font-size:25px}.ipa{text-align:center;color:#abb5cd;min-height:23px;font-size:14px}.mastery{display:flex;align-items:center;justify-content:center;gap:5px;margin:6px 0 8px}.rankdot{width:8px;height:8px;border-radius:50%;background:#303a56}.rankdot.on{background:var(--cyan);box-shadow:0 0 10px #45edffaa}.rankname{font-size:8px;color:var(--muted);margin-left:4px}.choices{display:grid;gap:8px;margin-top:11px}.choice{width:100%;min-height:55px;border:1px solid #2b3555;border-radius:15px;background:linear-gradient(#1b233b,#141a2e);color:var(--text);text-align:left;padding:12px 12px 12px 47px;font-weight:720;position:relative}.choice:before{content:attr(data-key);position:absolute;left:12px;top:50%;transform:translateY(-50%);width:25px;height:25px;border-radius:8px;display:grid;place-items:center;background:#0c1223;color:#8390ad;font-size:10px}.choice.correct{border-color:#59f0a2;background:#123627}.choice.wrong{border-color:#ff5d75;background:#3a1720}.feedback{min-height:74px;margin-top:10px;border-radius:14px;padding:0}.feedback.on{padding:10px;background:#090e1dcc;border:1px solid #26304a}.hit{font-weight:1000;color:var(--ok);font-size:12px}.miss{font-weight:1000;color:var(--bad);font-size:12px}.gain{float:right;color:var(--gold)}.detail{font-size:11px;line-height:1.5;margin-top:5px;color:#d6daf0}.note{color:#aeb6cf}.subskill{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.skill{background:#0b1020;border:1px solid #222d4a;border-radius:10px;padding:6px}.skilltop{display:flex;justify-content:space-between;font-size:8px;color:var(--muted)}.skill .bar{height:4px;margin-top:4px}.skill.rec .bar>div{background:linear-gradient(90deg,#45edff,#8b6cff)}.skill.prod .bar>div{background:linear-gradient(90deg,#ff48d2,#ffd66b)}.end{text-align:center}.rank{font-size:70px;font-weight:1000;line-height:1;color:var(--gold);text-shadow:0 0 35px #ffd66b55}.endgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.endgrid div{background:#0c1223;border:1px solid var(--line);border-radius:12px;padding:9px 3px}.endgrid b{display:block;font-size:17px}.endgrid span{font-size:7px;color:var(--muted)}.loot{background:linear-gradient(135deg,#24162d,#142c35);border:1px solid #8b6cff55;border-radius:15px;padding:11px;margin:10px 0;font-size:11px;line-height:1.6}.mistakes{text-align:left;max-height:220px;overflow:auto}.mistake{padding:7px 5px;border-bottom:1px solid #202945;font-size:10px}.float{position:fixed;z-index:99;pointer-events:none;font-weight:1000;color:var(--gold);text-shadow:0 0 15px #000;animation:fly .9s ease-out forwards}@keyframes fly{to{transform:translateY(-70px) scale(1.2);opacity:0}}.shake{animation:shake .28s linear}@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(30px);opacity:0;z-index:120;background:#0d1427ee;border:1px solid #334061;border-radius:999px;padding:8px 13px;font-size:10px;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:540px){.app{padding-left:9px;padding-right:9px}.panel{padding:11px;border-radius:18px}.prompt{font-size:36px}.prompt.jp{font-size:23px}.questgrid{gap:4px}.tabs{gap:4px}.tab{font-size:9px;padding:8px 2px}.zonebox{grid-template-columns:repeat(2,1fr)}}

/* v5: richer arcade rhythm, accessible typing and rival states */
:root{--rival:#ff9df9}body{background-image:radial-gradient(circle at 65% -12%,#284f7330,transparent 50%),radial-gradient(circle at 8% 85%,#b22c8030,transparent 40%)}

@keyframes pulseLogo{50%{box-shadow:0 0 25px #42eeff,0 0 45px #8b6cff88}}
.card.rival{box-shadow:inset 0 0 0 1px #ff9df977,0 0 27px #f257d623;border-color:#ff9df9!important}
.enemy.rival{color:#380e37;background:#ff9df9;font-weight:900}.enemy.typed{color:#101c29;background:#63d9ff}.enemy.audio{color:#06190f;background:#91fba1}
.typed-box{margin:16px 0 4px;padding:15px;border:1px solid #6886b588;border-radius:16px;background:linear-gradient(135deg,#101d36,#12182a)}
.typed-box label{display:block;color:#b5d7ff;font-weight:700;margin-bottom:9px;font-size:13px}.typed-row{display:flex;gap:8px}.typed-row input{min-width:0;flex:1;font:600 25px/1.4 system-ui,sans-serif;letter-spacing:.02em;color:white;background:#070d20;padding:13px;border-radius:12px;border:1px solid #6384bb;outline-color:#55dff0}

.checkline{display:flex!important;align-items:center;gap:7px;padding-top:11px;cursor:pointer;color:#bdc7df!important}.checkline input{accent-color:#66e4ff}
.audio-play{display:block;margin:10px auto;padding:10px 16px;color:#baf8ff;background:#173452;border:1px solid #4ca1ba;border-radius:12px;cursor:pointer;font-weight:800}
.next-question{width:100%;margin-top:12px;padding:13px 12px;border:0;border-radius:13px;background:linear-gradient(90deg,#ffb858,#ffe38e);color:#24180a;font-weight:900;font-size:14px;cursor:pointer}.flag{display:block;cursor:pointer;text-align:left;margin-top:13px;color:#bac9dc;background:transparent;border:1px solid #55617f;border-radius:9px;padding:7px 9px;font:inherit;font-size:11px}.flag:hover{border-color:#f5d49e}.flag:disabled{opacity:.5}
.subskill{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important}.subskill .skill{min-width:0}.subskill .skill .skilltop{font-size:10px!important}.subskill .skill span{white-space:normal!important}
#zoneStats{max-height:208px;overflow-y:auto}#migrateHint{opacity:.8}.tabs{flex-wrap:wrap!important}.tabs .tab{min-width:0}
@media(max-width:540px){.typed-row input{font-size:21px}.typed-row button{padding:9px 12px}.subskill{gap:5px!important}.subskill .skill{padding:7px!important}header .pill{padding-left:7px;padding-right:7px}.brand .subtitle{font-size:8px}}
@media(prefers-reduced-motion:reduce){.brand .logo{animation:none}*{scroll-behavior:auto!important}}
</style></head><body><div class="app"><header><div class="brand"><div class="logo">D</div><div><h1>DOPA QUEST v6.1</h1><div class="subtitle">MEMORY ARCADE / QUALITY UPDATE</div></div></div><div style="display:flex;gap:6px"><button class="pill" id="backupBtn">SAVE</button><button class="pill" id="loadBtn">LOAD</button><button class="pill" id="soundBtn">♪ SOUND</button><input id="loadFile" type="file" accept="application/json,.json" class="hidden"></div></header>
<section id="dopa-v6" class="panel" style="padding:12px;border-color:#34516c">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
  <div><b style="color:#45edff">DOPA QUEST · SYNC PREVIEW</b><div class="small" id="dataBadge">デッキ確認中…</div></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="pill" id="vocabLoad">語彙を読込</button><button class="pill" id="cloudLogin">Googleログイン</button><button class="pill" id="cloudSync">同期</button><button class="pill" id="cloudLogout">ログアウト</button></div>
  </div>
  <div class="small" id="cloudStatus" role="status" aria-live="polite" style="margin-top:9px">端末内保存。クラウド同期は未設定です。</div>

  <input type="file" accept=".json,application/json" id="vocabFile" class="hidden" />
</section><div class="panel" id="profile"><div class="hudrow"><div class="lvl" id="lvl"><b id="lv">LV.1</b></div><div><div style="display:flex;justify-content:space-between"><b id="title">Rookie</b><span class="small" id="xpText"></span></div><div class="bar"><div id="xpBar"></div></div><div class="small" id="masterSummary" style="margin-top:5px"></div></div><div class="money"><b id="coin">◈ 0</b><div class="small">DOPA</div></div></div><div class="questgrid" id="quests"></div></div>
<div class="panel" id="setup"><div class="tabs"><button class="tab active" data-mode="campaign">CAMPAIGN</button><button class="tab" data-mode="due">DUE RAID</button><button class="tab" data-mode="weak">NEMESIS</button><button class="tab" data-mode="rival">RIVAL DUEL</button><button class="tab" data-mode="free">FREE</button></div><div class="controls"><div><label>言語</label><select id="lang"><option value="shan">シャン語</option><option value="burmese">ビルマ語</option></select></div><div><label>ラウンド</label><select id="roundSize"><option>10</option><option selected>15</option><option>20</option><option>30</option></select></div><div><label>出題方向</label><select id="direction"><option value="adaptive" selected>自動適応</option><option value="toJP">原語 → 日本語</option><option value="fromJP">日本語 → 原語</option><option value="mix">50/50</option><option value="listen">音声→日本語（対応端末のみ）</option></select></div><div><label>速度</label><select id="speed"><option value="normal" selected>NORMAL</option><option value="rush">RUSH 10s</option><option value="hyper">HYPER 6s</option></select></div><div><label>解答形式</label><select id="answerMode"><option value="choice" selected>4択（基本）</option><option value="adaptive">4択＋入力（熟練語）</option><option value="typed">逆引きは文字入力</option></select></div><div><label>音声出題</label><label class="checkline"><input type="checkbox" id="includeAudio"> 対応端末のみ</label></div><div class="wide"><label>エリア</label><select id="zone"></select></div><div class="wide"><button class="primary" id="start">▶ QUEST START</button></div></div><div class="zonebox" id="zoneStats"></div><p class="small" id="audioNotice" aria-live="polite"></p><p class="small" id="migrateHint"></p><div class="small" id="modeHelp" style="margin-top:9px"></div><p class="small" style="margin-top:8px">v6.1：早期再正答はXPのみ。期限到来後の正答で熟練度が上がります。同義語で逆引きが曖昧な問題は認識問題へ切り替へます。</p></div>
<div id="game" class="hidden"><div class="stats"><div class="stat"><b id="qstat">0/0</b><span>QUEST</span></div><div class="stat"><b id="hitstat">0</b><span>HIT</span></div><div class="stat"><b id="combo">0</b><span>COMBO</span></div><div class="stat"><b id="xpstat">0</b><span>XP</span></div><div class="stat"><b id="timestat">∞</b><span>TIME</span></div></div><div class="progress"><div id="roundBar"></div></div><div class="arena"><div class="banner" id="banner"></div><div class="card" id="card"><div class="meta" id="meta"></div><div class="prompt" id="prompt"></div><div class="ipa" id="ipa"></div><button type="button" id="audioPlay" class="audio-play hidden">▶ 合成音声をもう一度聴く</button><div class="mastery" id="mastery"></div><div class="subskill" id="subskill"></div><div class="choices" id="choices"></div><div id="typedBox" class="typed-box hidden"><label for="typedAnswer">原語の綴りを入力（正書法で判定）</label><div class="typed-row"><input type="text" id="typedAnswer" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done"><button type="button" id="typedSubmit">判定 ▶</button></div><div class="small">入力用キーボードがない場合は、設定で4択に戻せます。</div></div><div class="feedback" id="feedback"></div></div></div></div>
<div class="panel hidden" id="result"></div></div><div class="toast" id="toast"></div><script src="./firebase-config.js" defer></script><script src="./bootstrap.js" defer></script></body></html>

<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>外大時間割帖</title><meta name="description" content="東京外国語大学の公開シラバスを検索し、時間割を組むための非公式ツール">
<style>
:root{--ink:#1e2229;--muted:#69707c;--line:#d8dce3;--paper:#f6f7f9;--panel:#fff;--accent:#8b1f57;--accent2:#5d1239;--soft:#f5e8ef;--warn:#b54708}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;font-size:16px}button,input,select{font:inherit}button{cursor:pointer}.top{height:64px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:5}.brand{font-weight:800;letter-spacing:.04em}.brand i{display:inline-block;width:10px;height:22px;background:var(--accent);vertical-align:-5px;margin-right:10px}.top small{color:var(--muted);margin-left:auto}.app{display:grid;grid-template-columns:390px minmax(680px,1fr);min-height:calc(100vh - 64px)}aside{background:var(--panel);border-right:1px solid var(--line);padding:22px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}h1,h2,p{margin-top:0}h1{font-size:1.25rem;margin-bottom:18px}h2{font-size:1rem;margin:24px 0 10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px;margin-bottom:11px}.field label{font-size:.82rem;font-weight:700;color:#464d58}.field input,.field select{width:100%;border:1px solid #bfc5cf;border-radius:7px;background:#fff;padding:9px 10px;min-height:42px}.primary,.secondary,.danger{border:0;border-radius:7px;padding:10px 13px;font-weight:700}.primary{background:var(--accent);color:#fff}.primary:hover{background:var(--accent2)}.secondary{background:#edf0f4;color:#2b3038}.danger{background:#fff0ee;color:#9b2c20}.status{min-height:24px;color:var(--muted);font-size:.86rem;margin:10px 0}.results{display:grid;gap:8px}.result{border:1px solid var(--line);border-radius:8px;padding:11px;background:#fff}.result strong{display:block;font-size:.92rem}.meta{color:var(--muted);font-size:.78rem;line-height:1.5;margin:4px 0 8px}.result .row{display:flex;justify-content:space-between;align-items:center;gap:8px}.add{padding:6px 10px;font-size:.8rem}.workspace{padding:24px;min-width:0}.workspace-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px}.workspace-head h1{margin:0}.actions{display:flex;gap:8px}.timetable{display:grid;grid-template-columns:62px repeat(5,minmax(118px,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}.cell{min-height:112px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px;min-width:0}.head{min-height:auto;background:#eef0f4;text-align:center;font-weight:800;padding:11px}.period{background:#f8f9fb;text-align:center;color:var(--muted);font-weight:800;padding-top:14px}.period span{display:block;font-size:.68rem;font-weight:500;margin-top:4px}.course{background:var(--soft);border-left:4px solid var(--accent);border-radius:6px;padding:7px;margin-bottom:6px;position:relative}.course.conflict{background:#fff3e8;border-left-color:var(--warn)}.course b{display:block;font-size:.82rem;line-height:1.35;padding-right:18px}.course small{display:block;color:#5e5060;font-size:.69rem;line-height:1.4;margin-top:4px}.remove{position:absolute;right:4px;top:3px;border:0;background:transparent;color:#777;font-size:1.1rem;padding:0 3px}.outside{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}.outside h2{margin:0 0 10px}.outside-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}.empty{color:var(--muted);font-size:.88rem}.notice{font-size:.76rem;line-height:1.5;color:var(--muted);margin-top:18px}.notice a{color:var(--accent)}.mobile-tabs{display:none}details{border:1px solid var(--line);border-radius:9px;padding:0 11px;margin:12px 0;background:#fafbfc}summary{padding:11px 0;font-weight:800;font-size:.88rem;cursor:pointer}.checks{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}.checks label{border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:.78rem;background:#fff}.checks input{margin-right:4px}.logic{display:grid;grid-template-columns:1fr 82px;gap:6px}
@media(max-width:900px){.top{padding:0 14px}.top small{display:none}.mobile-tabs{display:grid;grid-template-columns:1fr 1fr;position:sticky;top:64px;z-index:6;background:#fff;border-bottom:1px solid var(--line)}.mobile-tabs button{border:0;padding:12px;background:#fff;font-weight:700}.mobile-tabs button.active{color:var(--accent);border-bottom:3px solid var(--accent)}.app{display:block}.app aside,.workspace{position:static;height:auto;padding:16px}.app aside.hidden,.workspace.hidden{display:none}.workspace{overflow:auto}.timetable{min-width:720px}.workspace-head{min-width:720px}.outside{min-width:720px}}
</style></head><body>
<header class="top"><div class="brand"><i></i>外大時間割帖</div><small>東京外国語大学・非公式</small></header>
<nav class="mobile-tabs"><button data-tab="search" class="active">授業を探す</button><button data-tab="table">時間割</button></nav>
<div class="app"><aside id="searchPanel"><h1>授業を探す</h1>
<div class="grid2"><div class="field"><label for="year">開講年度</label><select id="year"></select></div><div class="field"><label for="term">学期</label><select id="term"><option value="0">すべて</option><option value="10">春学期</option><option value="18">夏学期</option><option value="20">秋学期</option><option value="28">冬学期</option><option value="50">通年</option><option value="60">通年（秋）</option></select></div></div>
<div class="field"><label for="faculty">開講部局</label><select id="faculty"><option value="NULL">すべて</option><option value="30">世界教養プログラム</option><option value="40">言語文化学部</option><option value="50">国際社会学部</option><option value="80">国際日本学部</option><option value="61">総合国際学研究科（博士前期）</option><option value="71">総合国際学研究科（博士後期）</option></select></div>
<div class="field"><label for="q">科目名</label><input id="q" placeholder="例：言語学"></div><div class="field"><label for="teacher">教員名</label><input id="teacher" placeholder="漢字・フリガナ・ローマ字"></div>
<div class="field"><label>曜日（複数可）</label><div class="checks" id="days"><label><input type="checkbox" value="0">月</label><label><input type="checkbox" value="1">火</label><label><input type="checkbox" value="2">水</label><label><input type="checkbox" value="3">木</label><label><input type="checkbox" value="4">金</label><label><input type="checkbox" value="5">時間外</label><label><input type="checkbox" value="6">集中</label></div></div>
<div class="field"><label>時限（複数可）</label><div class="checks" id="periods"><label><input type="checkbox" value="1">1</label><label><input type="checkbox" value="2">2</label><label><input type="checkbox" value="3">3</label><label><input type="checkbox" value="4">4</label><label><input type="checkbox" value="5">5</label><label><input type="checkbox" value="6">6</label></div></div>
<div class="field"><label for="code">時間割コード</label><input id="code" inputmode="numeric" placeholder="例：500012"></div>
<details><summary>詳細条件</summary>
<div class="grid2"><div class="field"><label for="entryYear">入学年度</label><select id="entryYear"><option value="">開講年度と同じ</option></select></div><div class="field"><label for="grade">対象年次</label><select id="grade"><option value="NULL">指定なし</option><option value="1">1年</option><option value="2">2年</option><option value="3">3年</option><option value="4">4年</option><option value="5">5年</option></select></div></div>
<div class="field"><label for="subject1">科目区分・階層1</label><select id="subject1"><option value="">指定なし</option><option value="30-19-FC">基礎科目</option><option value="30-19-LA">教養科目</option><option value="30-19-LC">言語科目</option><option value="30-19-AR">地域科目</option><option value="80-19-PB">協働実践科目</option><option value="40-19-INT">導入科目（言文）</option><option value="50-19-INT">導入科目（国社）</option><option value="80-19-INT">導入科目（国日）</option><option value="40-19-SUR">概論科目（言文）</option><option value="50-19-SUR">概論科目（国社）</option><option value="80-19-SUR">概論科目（国日）</option><option value="40-19-LEC">専門科目（言文）</option><option value="50-19-LEC">専門科目（国社）</option><option value="80-19-LEC">専門科目（国日）</option><option value="61-16-GGS">研究科共通科目（前期）</option><option value="61-16-GS">世界言語社会専攻</option><option value="61-16-JS">国際日本専攻</option><option value="71-18-GGS">研究科共通科目（後期）</option><option value="71-18-GS">世界言語社会専攻（後期）</option><option value="71-18-JS">国際日本専攻（後期）</option></select></div>
<div class="field"><label for="subject2">科目区分・階層2</label><select id="subject2"><option value="">指定なし</option><option value="30-19-AL">基礎リテラシー</option><option value="30-21-BS">基礎演習</option><option value="30-19-LAC">現代教養科目</option><option value="30-19-NS">自然科学系科目</option><option value="30-19-WL">世界言語科目</option><option value="30-19-NonML">非モジュール言語科目</option><option value="30-19-ML">モジュール言語科目</option><option value="30-19-GE">GLIP英語科目</option><option value="30-19-FL">教養外国語科目</option><option value="30-19-RL">諸地域言語科目</option><option value="30-19-AB">地域基礎科目</option><option value="40-19-LEC-RS">地域コース</option><option value="40-19-LEC-TS">超域コース</option><option value="50-19-LEC-AS">地域社会研究コース</option><option value="50-19-LEC-CG">現代世界論コース</option><option value="50-19-LEC-IR">国際関係コース</option><option value="61-16-CS">必修</option><option value="61-16-LTAP">学術言語演習</option><option value="61-16-AA">アジア・アフリカ・フィールドサイエンス</option><option value="61-16-LC">言語文化コース</option><option value="61-16-AI">国際社会コース</option><option value="61-16-TS">修士論文・修士研究ゼミ</option><option value="61-16-MS">専攻科目（ゼミ以外）</option></select></div>
<div class="field"><label for="subject3">科目区分・階層3（言語・地域等）</label><select id="subject3"><option value="">指定なし</option><optgroup label="専攻言語"><option value="30-19-ML-English">英語</option><option value="30-19-ML-German">ドイツ語</option><option value="30-19-ML-French">フランス語</option><option value="30-19-ML-Spanish">スペイン語</option><option value="30-19-ML-Russian">ロシア語</option><option value="30-19-ML-Chinese">中国語</option><option value="30-19-ML-Korean">朝鮮語</option><option value="30-19-ML-Arabic">アラビア語</option><option value="30-19-ML-Mongolian">モンゴル語</option><option value="30-19-ML-Indonesian">インドネシア語</option><option value="30-19-ML-Thai">タイ語</option><option value="30-19-ML-Laotian">ラオス語</option><option value="30-19-ML-Vietnamese">ベトナム語</option><option value="30-19-ML-Khmer">カンボジア語</option><option value="30-19-ML-Burmese">ビルマ語</option><option value="30-19-ML-Urdu">ウルドゥー語</option><option value="30-19-ML-Hindi">ヒンディー語</option><option value="30-19-ML-Bengali">ベンガル語</option><option value="30-19-ML-Persian">ペルシア語</option><option value="30-19-ML-Turkish">トルコ語</option><option value="30-19-ML-Uzbek">ウズベク語</option></optgroup><optgroup label="地域基礎"><option value="30-19-AB-NW">北西ヨーロッパ</option><option value="30-19-AB-CE">中央ヨーロッパ</option><option value="30-19-AB-RU">ロシア</option><option value="30-19-AB-CA">中央アジア</option><option value="30-19-AB-EA">東アジア</option><option value="30-19-AB-SEA">東南アジア</option><option value="30-19-AB-SA">南アジア</option><option value="30-19-AB-ME">中東</option><option value="30-19-AB-AF">アフリカ</option></optgroup><optgroup label="博士前期"><option value="61-16-LC-TS">言語文化・修士論文修士研究ゼミ</option><option value="61-16-LC-MS">言語文化・専攻科目</option><option value="61-16-AI-TS">国際社会・修士論文修士研究ゼミ</option><option value="61-16-AI-MS">国際社会・専攻科目</option></optgroup></select></div>
<div class="grid2"><div class="field"><label for="embodiment">開講形態</label><select id="embodiment"><option value="">指定なし</option><option value="1">対面</option><option value="2">オンライン</option><option value="3">海外からオンライン</option><option value="4">オンデマンド</option></select></div><div class="field"><label for="lectureType">授業形態</label><select id="lectureType"><option value="NULL">指定なし</option><option value="0">講義</option><option value="1">実習・演習</option></select></div></div>
<div class="grid2"><div class="field"><label for="language">使用言語</label><select id="language"><option value="">指定なし</option><option value="001">日本語</option><option value="002">英語</option><option value="003">英語（一部日本語）</option><option value="004">その他</option></select></div><div class="field"><label for="building">講義棟</label><select id="building"><option value="NULL">指定なし</option><option value="101">研究講義棟1F</option><option value="102">研究講義棟2F</option><option value="103">研究講義棟3F</option><option value="104">研究講義棟4F</option><option value="105">研究講義棟5F</option><option value="106">研究講義棟6F</option><option value="107">研究講義棟7F</option><option value="108">研究講義棟8F</option><option value="900">その他</option></select></div></div>
<div class="field"><label for="keyword">キーワード検索</label><div class="logic"><input id="keyword"><select id="keywordLogic"><option value="and">AND</option><option value="or">OR</option></select></div></div>
<div class="field"><label for="fulltext">全文検索</label><div class="logic"><input id="fulltext"><select id="fulltextLogic"><option value="and">AND</option><option value="or">OR</option></select></div></div>
<div class="checks"><label><input id="experienced" type="checkbox">実務経験のある教員による授業</label></div>
</details>
<button id="search" class="primary" style="width:100%">検索</button><div id="status" class="status">条件を入れて検索してください。</div><div id="results" class="results"></div>
<p class="notice">公開シラバスを検索する非公式ツールです。履修登録前には、必ず<a href="https://gakumu-web1.tufs.ac.jp/portal/Public/Syllabus/SylSearchMain.aspx" target="_blank" rel="noreferrer">学務情報システム上の最新情報</a>を確認してください。</p></aside>
<main id="tablePanel" class="workspace"><div class="workspace-head"><div><h1>時間割</h1><div id="count" class="status" style="margin:3px 0 0"></div></div><div class="actions"><button id="export" class="secondary">JSON保存</button><button id="clear" class="danger">全削除</button></div></div><div id="timetable" class="timetable"></div><section class="outside"><h2>時間外・集中・曜日未定</h2><div id="outside" class="outside-list"></div></section></main></div>
<script>
const DAYS=['月','火','水','木','金'], TIMES=['8:30–10:00','10:10–11:40','12:40–14:10','14:20–15:50','16:00–17:30','17:40–19:10'];
const state={courses:JSON.parse(localStorage.getItem('tufs-timetable-courses')||'[]')};
const $=s=>document.querySelector(s), esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
for(let y=2026;y>=2017;y--){$('#year').insertAdjacentHTML('beforeend','<option>'+y+'</option>');$('#entryYear').insertAdjacentHTML('beforeend','<option>'+y+'</option>')}
function save(){localStorage.setItem('tufs-timetable-courses',JSON.stringify(state.courses));render()}
function remove(code){state.courses=state.courses.filter(c=>c.code!==code);save()}
function card(c,conflict=false){return '<article class="course '+(conflict?'conflict':'')+'"><button class="remove" data-remove="'+esc(c.code)+'" aria-label="削除">×</button><b>'+esc(c.title)+'</b><small>'+esc(c.teacher)+(c.room?' · '+esc(c.room):'')+'</small><small><a href="'+esc(c.url)+'" target="_blank" rel="noreferrer">'+esc(c.code)+' / シラバス</a></small></article>'}
function render(){let html='<div class="cell head"></div>'+DAYS.map(d=>'<div class="cell head">'+d+'</div>').join('');for(let p=1;p<=6;p++){html+='<div class="cell period">'+p+'<span>'+TIMES[p-1]+'</span></div>';for(const d of DAYS){const cs=state.courses.filter(c=>(c.slots||[]).some(s=>s.day===d&&s.period===p));html+='<div class="cell">'+cs.map(c=>card(c,cs.length>1)).join('')+'</div>'}}$('#timetable').innerHTML=html;const out=state.courses.filter(c=>!(c.slots||[]).length);$('#outside').innerHTML=out.length?out.map(c=>card(c)).join(''):'<div class="empty">まだありません。</div>';$('#count').textContent=state.courses.length+'科目'+(document.querySelectorAll('.conflict').length?' · 重複あり':'');document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>remove(b.dataset.remove))}
$('#search').onclick=async()=>{const p=new URLSearchParams();for(const id of ['year','term','faculty','q','teacher','code','entryYear','grade','subject1','subject2','subject3','embodiment','lectureType','language','building','keyword','keywordLogic','fulltext','fulltextLogic'])p.set(id,$('#'+id).value.trim());document.querySelectorAll('#days input:checked').forEach(x=>p.append('day',x.value));document.querySelectorAll('#periods input:checked').forEach(x=>p.append('period',x.value));if($('#experienced').checked)p.set('experienced','1');$('#status').textContent='外大シラバスを検索中…';$('#results').innerHTML='';$('#search').disabled=true;try{const base=location.hostname.endsWith('lilihuachan.chatgpt.site')?'':'https://tufs-timetable.lilihuachan.chatgpt.site';const r=await fetch(base+'/api/search?'+p);const data=await r.json();if(!r.ok)throw new Error(data.error||'検索できませんでした');$('#status').textContent=data.courses.length?data.courses.length+'件（先頭ページ）':'該当する授業はありません。';$('#results').innerHTML=data.courses.map(c=>'<article class="result"><strong>'+esc(c.title)+'</strong><div class="meta">'+esc(c.theme)+'<br>'+esc(c.teacher)+'<br>'+esc(c.dayPeriod)+(c.room?' · '+esc(c.room):'')+' · '+esc(c.code)+'</div><div class="row"><a href="'+esc(c.url)+'" target="_blank" rel="noreferrer">詳細</a><button class="primary add" data-add="'+esc(c.code)+'">追加</button></div></article>').join('');document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const c=data.courses.find(x=>x.code===b.dataset.add);if(!state.courses.some(x=>x.code===c.code)){state.courses.push(c);save()}b.textContent='追加済み';b.disabled=true})}catch(e){$('#status').textContent='検索に接続できませんでした。少し待って再試行してください。'}finally{$('#search').disabled=false}};
$('#clear').onclick=()=>{if(state.courses.length&&confirm('時間割をすべて削除しますか？')){state.courses=[];save()}};
$('#export').onclick=()=>{const blob=new Blob([JSON.stringify(state.courses,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tufs-timetable.json';a.click();URL.revokeObjectURL(a.href)};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));$('#searchPanel').classList.toggle('hidden',b.dataset.tab!=='search');$('#tablePanel').classList.toggle('hidden',b.dataset.tab!=='table')});render();
</script></body></html>

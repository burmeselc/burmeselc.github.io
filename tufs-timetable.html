<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>外大時間割帖</title><meta name="description" content="東京外国語大学の公開シラバスを検索し、時間割を組むための非公式ツール">
<style>
:root{--ink:#1e2229;--muted:#69707c;--line:#d8dce3;--paper:#f6f7f9;--panel:#fff;--accent:#8b1f57;--accent2:#5d1239;--soft:#f5e8ef;--warn:#b54708}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;font-size:16px}button,input,select{font:inherit}button{cursor:pointer}.top{height:64px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:5}.brand{font-weight:800;letter-spacing:.04em}.brand i{display:inline-block;width:10px;height:22px;background:var(--accent);vertical-align:-5px;margin-right:10px}.top small{color:var(--muted);margin-left:auto}.app{display:grid;grid-template-columns:370px minmax(680px,1fr);min-height:calc(100vh - 64px)}aside{background:var(--panel);border-right:1px solid var(--line);padding:22px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}h1,h2,p{margin-top:0}h1{font-size:1.25rem;margin-bottom:18px}h2{font-size:1rem;margin:24px 0 10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px;margin-bottom:11px}.field label{font-size:.82rem;font-weight:700;color:#464d58}.field input,.field select{width:100%;border:1px solid #bfc5cf;border-radius:7px;background:#fff;padding:9px 10px;min-height:42px}.primary,.secondary,.danger{border:0;border-radius:7px;padding:10px 13px;font-weight:700}.primary{background:var(--accent);color:#fff}.primary:hover{background:var(--accent2)}.secondary{background:#edf0f4;color:#2b3038}.danger{background:#fff0ee;color:#9b2c20}.searchbar{display:grid;grid-template-columns:1fr auto;gap:8px}.status{min-height:24px;color:var(--muted);font-size:.86rem;margin:10px 0}.results{display:grid;gap:8px}.result{border:1px solid var(--line);border-radius:8px;padding:11px;background:#fff}.result strong{display:block;font-size:.92rem}.meta{color:var(--muted);font-size:.78rem;line-height:1.5;margin:4px 0 8px}.result .row{display:flex;justify-content:space-between;align-items:center;gap:8px}.add{padding:6px 10px;font-size:.8rem}.workspace{padding:24px;min-width:0}.workspace-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px}.workspace-head h1{margin:0}.actions{display:flex;gap:8px}.timetable{display:grid;grid-template-columns:62px repeat(5,minmax(118px,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}.cell{min-height:112px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px;min-width:0}.head{min-height:auto;background:#eef0f4;text-align:center;font-weight:800;padding:11px}.period{background:#f8f9fb;text-align:center;color:var(--muted);font-weight:800;padding-top:14px}.period span{display:block;font-size:.68rem;font-weight:500;margin-top:4px}.course{background:var(--soft);border-left:4px solid var(--accent);border-radius:6px;padding:7px;margin-bottom:6px;position:relative}.course.conflict{background:#fff3e8;border-left-color:var(--warn)}.course b{display:block;font-size:.82rem;line-height:1.35;padding-right:18px}.course small{display:block;color:#5e5060;font-size:.69rem;line-height:1.4;margin-top:4px}.remove{position:absolute;right:4px;top:3px;border:0;background:transparent;color:#777;font-size:1.1rem;padding:0 3px}.outside{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}.outside h2{margin:0 0 10px}.outside-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}.empty{color:var(--muted);font-size:.88rem}.notice{font-size:.76rem;line-height:1.5;color:var(--muted);margin-top:18px}.notice a{color:var(--accent)}.mobile-tabs{display:none}
@media(max-width:900px){.top{padding:0 14px}.top small{display:none}.mobile-tabs{display:grid;grid-template-columns:1fr 1fr;position:sticky;top:64px;z-index:6;background:#fff;border-bottom:1px solid var(--line)}.mobile-tabs button{border:0;padding:12px;background:#fff;font-weight:700}.mobile-tabs button.active{color:var(--accent);border-bottom:3px solid var(--accent)}.app{display:block}.app aside,.workspace{position:static;height:auto;padding:16px}.app aside.hidden,.workspace.hidden{display:none}.workspace{overflow:auto}.timetable{min-width:720px}.workspace-head{min-width:720px}.outside{min-width:720px}}
</style></head><body>
<header class="top"><div class="brand"><i></i>外大時間割帖</div><small>東京外国語大学・非公式</small></header>
<nav class="mobile-tabs"><button data-tab="search" class="active">授業を探す</button><button data-tab="table">時間割</button></nav>
<div class="app"><aside id="searchPanel"><h1>授業を探す</h1>
<div class="grid2"><div class="field"><label for="year">開講年度</label><select id="year"></select></div><div class="field"><label for="term">学期</label><select id="term"><option value="0">すべて</option><option value="10">春学期</option><option value="18">夏学期</option><option value="20">秋学期</option><option value="28">冬学期</option><option value="50">通年</option><option value="60">通年（秋）</option></select></div></div>
<div class="field"><label for="faculty">開講部局</label><select id="faculty"><option value="NULL">すべて</option><option value="30">世界教養プログラム</option><option value="40">言語文化学部</option><option value="50">国際社会学部</option><option value="80">国際日本学部</option><option value="61">総合国際学研究科（博士前期）</option><option value="71">総合国際学研究科（博士後期）</option></select></div>
<div class="field"><label for="q">科目名</label><input id="q" placeholder="例：言語学"></div><div class="field"><label for="teacher">教員名</label><input id="teacher" placeholder="漢字・フリガナ・ローマ字"></div>
<div class="grid2"><div class="field"><label for="day">曜日</label><select id="day"><option value="">指定なし</option><option value="0">月</option><option value="1">火</option><option value="2">水</option><option value="3">木</option><option value="4">金</option><option value="5">時間外</option><option value="6">集中</option></select></div><div class="field"><label for="period">時限</label><select id="period"><option value="">指定なし</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div></div>
<div class="field"><label for="code">時間割コード</label><input id="code" inputmode="numeric" placeholder="例：500012"></div>
<button id="search" class="primary" style="width:100%">検索</button><div id="status" class="status">条件を入れて検索してください。</div><div id="results" class="results"></div>
<p class="notice">公開シラバスを検索する非公式ツールです。履修登録前には、必ず<a href="https://gakumu-web1.tufs.ac.jp/portal/Public/Syllabus/SylSearchMain.aspx" target="_blank" rel="noreferrer">学務情報システム上の最新情報</a>を確認してください。</p></aside>
<main id="tablePanel" class="workspace"><div class="workspace-head"><div><h1>時間割</h1><div id="count" class="status" style="margin:3px 0 0"></div></div><div class="actions"><button id="export" class="secondary">JSON保存</button><button id="clear" class="danger">全削除</button></div></div><div id="timetable" class="timetable"></div><section class="outside"><h2>時間外・集中・曜日未定</h2><div id="outside" class="outside-list"></div></section></main></div>
<script>
const DAYS=['月','火','水','木','金'], TIMES=['8:30–10:00','10:10–11:40','12:40–14:10','14:20–15:50','16:00–17:30','17:40–19:10'];
const state={courses:JSON.parse(localStorage.getItem('tufs-timetable-courses')||'[]')};
const $=s=>document.querySelector(s), esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
for(let y=2026;y>=2017;y--) $('#year').insertAdjacentHTML('beforeend','<option>'+y+'</option>');
function save(){localStorage.setItem('tufs-timetable-courses',JSON.stringify(state.courses));render()}
function remove(code){state.courses=state.courses.filter(c=>c.code!==code);save()}
function card(c,conflict=false){return '<article class="course '+(conflict?'conflict':'')+'"><button class="remove" data-remove="'+esc(c.code)+'" aria-label="削除">×</button><b>'+esc(c.title)+'</b><small>'+esc(c.teacher)+(c.room?' · '+esc(c.room):'')+'</small><small><a href="'+esc(c.url)+'" target="_blank" rel="noreferrer">'+esc(c.code)+' / シラバス</a></small></article>'}
function render(){let html='<div class="cell head"></div>'+DAYS.map(d=>'<div class="cell head">'+d+'</div>').join('');for(let p=1;p<=6;p++){html+='<div class="cell period">'+p+'<span>'+TIMES[p-1]+'</span></div>';for(const d of DAYS){const cs=state.courses.filter(c=>(c.slots||[]).some(s=>s.day===d&&s.period===p));html+='<div class="cell">'+cs.map(c=>card(c,cs.length>1)).join('')+'</div>'}}$('#timetable').innerHTML=html;const out=state.courses.filter(c=>!(c.slots||[]).length);$('#outside').innerHTML=out.length?out.map(c=>card(c)).join(''):'<div class="empty">まだありません。</div>';$('#count').textContent=state.courses.length+'科目'+(document.querySelectorAll('.conflict').length?' · 重複あり':'');document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>remove(b.dataset.remove))}
$('#search').onclick=async()=>{const p=new URLSearchParams();for(const id of ['year','term','faculty','q','teacher','day','period','code'])p.set(id,$('#'+id).value.trim());$('#status').textContent='外大シラバスを検索中…';$('#results').innerHTML='';$('#search').disabled=true;try{const base=location.protocol==='file:'?'https://tufs-timetable.lilihuachan.chatgpt.site':'';const r=await fetch(base+'/api/search?'+p,{credentials:'include'});const data=await r.json();if(!r.ok)throw new Error(data.error||'検索できませんでした');$('#status').textContent=data.courses.length?data.courses.length+'件（先頭ページ）':'該当する授業はありません。';$('#results').innerHTML=data.courses.map(c=>'<article class="result"><strong>'+esc(c.title)+'</strong><div class="meta">'+esc(c.theme)+'<br>'+esc(c.teacher)+'<br>'+esc(c.dayPeriod)+(c.room?' · '+esc(c.room):'')+' · '+esc(c.code)+'</div><div class="row"><a href="'+esc(c.url)+'" target="_blank" rel="noreferrer">詳細</a><button class="primary add" data-add="'+esc(c.code)+'">追加</button></div></article>').join('');document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const c=data.courses.find(x=>x.code===b.dataset.add);if(!state.courses.some(x=>x.code===c.code)){state.courses.push(c);save()}b.textContent='追加済み';b.disabled=true})}catch(e){$('#status').textContent='検索に接続できません。先に公開版を開いてから、もう一度お試しください。'}finally{$('#search').disabled=false}};
$('#clear').onclick=()=>{if(state.courses.length&&confirm('時間割をすべて削除しますか？')){state.courses=[];save()}};
$('#export').onclick=()=>{const blob=new Blob([JSON.stringify(state.courses,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tufs-timetable.json';a.click();URL.revokeObjectURL(a.href)};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));$('#searchPanel').classList.toggle('hidden',b.dataset.tab!=='search');$('#tablePanel').classList.toggle('hidden',b.dataset.tab!=='table')});render();
</script></body></html>

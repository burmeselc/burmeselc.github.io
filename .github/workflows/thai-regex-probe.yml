name: Probe SEAlang Thai regex partition semantics
on:
  push:
    branches: [feature/thai-sealang-autosplit-phonology-20261020]
    paths: ['.github/workflows/thai-regex-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Controlled regex syntax diagnostics
        run: |
          python - <<'PY'
          import ssl,urllib.request,urllib.parse,re,time
          from urllib.robotparser import RobotFileParser
          ctx=ssl._create_unverified_context()
          user_agent='ThaiALALC-AcademicLexicon/0.2'
          with urllib.request.urlopen('https://sealang.net/robots.txt',context=ctx,timeout=25) as r:
              robots=r.read(300000).decode('utf-8','replace')
          rp=RobotFileParser();rp.parse(robots.splitlines())
          for i,query in enumerate(['ก$','ก[กข].*','กก.*']):
              url='https://sealang.net/api/api.pl?'+urllib.parse.urlencode({'service':'dictionary','lang':'Thai','query':query})
              if not rp.can_fetch(user_agent,url):raise RuntimeError('robots disallow query')
              if i:time.sleep(max(20,float(rp.crawl_delay(user_agent) or 0)))
              req=urllib.request.Request(url,headers={'User-Agent':user_agent})
              with urllib.request.urlopen(req,context=ctx,timeout=30) as res:
                  body=res.read(120000).decode('utf-8','replace')
              cap=re.search(r'Excessive number of hits[^\n<]{0,100}',body,re.I)
              n=re.search(r'(\d[\d,]*)\s+items found',body)
              match=re.search(r'Searching native orthography for[^\n<]{0,100}',body)
              print('PROBE',query,'bytes',len(body),'hits',n.group(1) if n else '?','cap',cap.group(0) if cap else None,'match',match.group(0) if match else None,flush=True)
          PY

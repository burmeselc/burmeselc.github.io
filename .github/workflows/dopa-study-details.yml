name: DOPA QUEST detailed study pilot
on:
  pull_request:
    paths:
      - 'dopa-quest/**'
      - '.github/workflows/dopa-study-details.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  detailed-study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild reviewed metadata reproducibly
        run: |
          python3 dopa-quest/scripts/build-study-details.py
          python3 dopa-quest/scripts/audit-shan-senses.py
          git diff --exit-code -- dopa-quest/data/study-details-pilot-v1.json dopa-quest/data/shan-sense-audit-v1.json
      - name: Syntax and Node regression checks
        run: |
          node --check dopa-quest/game.js
          node --check dopa-quest/bootstrap.js
          node --check dopa-quest/study-details.js
          node --test dopa-quest/tests/quality.test.mjs dopa-quest/tests/category-pilot.test.mjs dopa-quest/tests/shan-category.test.mjs dopa-quest/tests/shan-sense-lab.test.mjs dopa-quest/tests/sound-fx.test.mjs dopa-quest/tests/study-details.test.mjs dopa-quest/tests/shan-sense-audit.test.mjs
      - name: Install headless Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Mobile browser checks and existing learning regressions
        run: |
          python3 -m http.server 8123 > /tmp/dopa-http.log 2>&1 &
          node --test dopa-quest/tests/study-details-browser.test.mjs dopa-quest/tests/category-browser.test.mjs dopa-quest/tests/shan-browser.test.mjs dopa-quest/tests/shan-sense-browser.test.mjs dopa-quest/tests/sound-fx-browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dopa-study-details-mobile-preview
          path: |
            dopa-study-details-mobile.png
            dopa-study-details-review-mobile.png
            dopa-study-details-clothing-mobile.png
            dopa-study-details-psych-mobile.png
            dopa-study-details-law-mobile.png
          if-no-files-found: ignore

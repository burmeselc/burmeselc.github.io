name: SEAlang Thai API diagnostic (one word)
on:
  push:
    branches: ["feature/sealang-thai-import"]
    paths: [".github/workflows/thai-sealang-probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect dictionary API record structure (one request)
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,re,collections
          from html.parser import HTMLParser
          url='http://sealang.net/api/api.pl?'+urllib.parse.urlencode({'service':'dictionary','lang':'Thai','query':'ภาษา'})
          request=urllib.request.Request(url,headers={'User-Agent':'ThaiALALC-Research/0.1 (permission granted)','Accept':'text/html'})
          with urllib.request.urlopen(request,timeout=20) as response:
              html=response.read(150000).decode('utf-8','replace')
              print('STATUS',response.status,'ACTUAL URL',response.url,'HTML CHARS',len(html))
          class Tags(HTMLParser):
              def __init__(self):super().__init__();self.tags=collections.Counter();self.classes=collections.Counter()
              def handle_starttag(self,tag,attrs):
                  self.tags[tag]+=1
                  cls=dict(attrs).get('class','')
                  if cls:self.classes.update(cls.split())
          tags=Tags();tags.feed(html)
          print('TAGS',tags.tags.most_common(24))
          print('CLASSES',tags.classes.most_common(28))
          for label,regex in [('ORTH',r'<orth\b'),('ENTRY',r'<entry\b'),('W',r'<w\b'),('DEFINITION',r'<def\b'),('LEMMA',r'lemma='),('GLOSS',r'gloss')]:
              matches=list(re.finditer(regex,html,re.I))
              print(label,'COUNT',len(matches))
              for m in matches[-3:]:
                  print(label+' HTML:',re.sub(r'\s+',' ',html[max(0,m.start()-260):m.start()+850]))
          PY

name: SEAlang Thai API diagnostic (one word)
on:
  push:
    branches: ["feature/sealang-thai-import"]
    paths: [".github/workflows/thai-sealang-probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe robots and one Thai entry (diagnostic only)
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,time,re,ssl,hashlib
          from urllib.error import HTTPError,URLError
          urls=[
            ('http robots','http://sealang.net/robots.txt',None),
            ('www identify','https://www.sealang.net/api/api.pl?service=identify',None),
            ('api insecure diagnostic','https://sealang.net/api/api.pl?'+urllib.parse.urlencode({'service':'dictionary','lang':'Thai','query':'ภาษา'}),ssl._create_unverified_context()),
          ]
          for label,url,context in urls:
            print('REQUEST',label,url,flush=True)
            request=urllib.request.Request(url,headers={'User-Agent':'ThaiALALC-Research/0.1 (permission based; single query)','Accept':'text/html,*/*'})
            try:
              with urllib.request.urlopen(request,timeout=12,context=context) as r:
                content=r.read(100000)
                html=content.decode('utf-8','replace')
                print('STATUS',r.status,'URL',r.url,'MIME',r.headers.get('Content-Type'),'CHARS',len(html),flush=True)
                print('RESULT PREFIX:',re.sub(r'\s+',' ',html[:4200]),flush=True)
            except Exception as e:
              print('REQUEST ERROR',repr(e),flush=True)
            time.sleep(8)
          PY

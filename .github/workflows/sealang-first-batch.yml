name: SEAlang Thai limited import test
on:
  push:
    branches: [feature/thai-sealang-import]
    paths: ['.github/workflows/sealang-first-batch.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/thai-sealang-import
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install beautifulsoup4
      - name: Collect two rare Thai character patterns
        working-directory: thai-alalc
        run: |
          python scripts/sealang_api_thai.py --queries 'ณ.*' 'ฬ.*' --limit 2 --delay 12 --legacy-tls --run --permission-confirmed
          python scripts/build_dictionary.py --source data/sealang-shards/
          python - <<'PY'
          import csv,glob,json
          shards=glob.glob('data/sealang-shards/*.csv')
          count=sum(sum(1 for _ in csv.DictReader(open(p,encoding='utf-8'))) for p in shards)
          rows=json.load(open('dictionary.json',encoding='utf-8'))
          print('SHARDS',len(shards),'RECORDS',count,'DICTIONARY',len(rows))
          if count<1:raise SystemExit('No SEAlang rows; refusing to commit.')
          PY
      - name: Run tests
        run: |
          python -m unittest discover -s thai-alalc/tests -v
          node --check thai-alalc/app.js
      - name: Commit limited public dictionary data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thai-alalc/data/sealang-shards/ thai-alalc/dictionary.json
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Import first SEAlang Thai entries from limited API queries"
            git push origin HEAD:feature/thai-sealang-import
          fi

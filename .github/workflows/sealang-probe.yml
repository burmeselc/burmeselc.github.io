name: Probe SEAlang Thai API (limited)
on:
  push:
    branches: [feature/thai-sealang-import]
    paths: ['.github/workflows/sealang-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect a single dictionary response
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse, urllib.error, re, ssl
          url='https://sealang.net/api/api.pl?'+urllib.parse.urlencode({'service':'dictionary','lang':'Thai','query':'^ณ.*'})
          print('url:',url,flush=True)
          try:
              req=urllib.request.Request(url,headers={'User-Agent':'ThaiALALC-academic-dictionary-probe/0.1'})
              with urllib.request.urlopen(req, timeout=18, context=ssl._create_unverified_context()) as res:
                  print('status:',res.status,'type:',res.headers.get('Content-Type'),flush=True)
                  raw=res.read(160000)
                  print('bytes_read:',len(raw),flush=True)
                  html=raw.decode('utf-8','replace')
                  print('ITEM_COUNTS',re.findall(r'\d+ items found',html))
                  print('ENTRIES',len(re.findall(r'<entry\b',html)),'SUBENTRIES',len(re.findall(r'<subentry\b',html)))
                  print('HTML_PREVIEW_BEGIN')
                  print(html[-3500:])
                  print('HTML_PREVIEW_END')
                  print('TABLES',len(re.findall(r'<table',html,re.I)),'TRS',len(re.findall(r'<tr',html,re.I)))
          except Exception as e: print('Probe failed:',type(e).__name__,str(e),flush=True)
          PY

name: Thai SEAlang pilot acquisition
on:
  push:
    branches: [feature/thai-sealang-autosplit-phonology-20261020]
    paths: ['.github/workflows/thai-sealang-pilot.yml']
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/thai-sealang-autosplit-phonology-20261020
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Collect six low-to-medium volume Thai orthography queries
        working-directory: thai-alalc
        run: |
          python scripts/sealang_crawl.py --queries 'กก.*' 'กว.*' 'กะ.*' 'กระด.*' 'กำ.*' 'ขำ.*' \
            --max-requests 6 --max-depth 1 --delay 20 \
            --legacy-tls --run --permission-confirmed
          python scripts/build_dictionary.py --source data/sealang-shards/
          python scripts/audit_candidates.py --size 150
      - name: Verify parsers and tests
        run: |
          python -m unittest discover -s thai-alalc/tests -v
          node --test thai-alalc/tests/romanizer.test.mjs
          node --check thai-alalc/app.js
      - name: Preserve acquired shards and crawl/audit metadata on the branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add thai-alalc/data/sealang-shards/ thai-alalc/data/sealang-crawl-state.json thai-alalc/data/alalc-candidate-audit.json thai-alalc/dictionary.json
          if git diff --cached --quiet; then echo 'No changes'; else
            git commit -m 'Import controlled Thai pilot batch and generate candidate audit'
            git push origin HEAD:feature/thai-sealang-autosplit-phonology-20261020
          fi

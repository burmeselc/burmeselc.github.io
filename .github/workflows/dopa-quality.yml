name: DOPA QUEST quality checks
on:
  pull_request:
    paths:
      - 'dopa-quest/**'
      - '.github/workflows/dopa-quality.yml'
  push:
    branches:
      - main
    paths:
      - 'dopa-quest/**'
      - '.github/workflows/dopa-quality.yml'
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dopa-quest/game.js
      - run: node --check dopa-quest/bootstrap.js
      - run: node --check dopa-quest/cloud-sync.js
      - run: node --test dopa-quest/tests/quality.test.mjs
      - run: node --test dopa-quest/tests/pwa.test.mjs
      - run: node --check dopa-quest/service-worker.js
      - name: Check incoming Shan CSV audit is read-only and lossless
        run: python3 -m unittest discover -s dopa-quest/tests -p 'test_additional_shan_audit.py' -v

      - name: Verify Shan master ledger provenance and source parsing
        run: python3 -m unittest discover -s dopa-quest/tests -p 'test_shan_master_ledger.py' -v
      - name: Validate non-destructive Shan 1,211-form review proposals
        run: python3 -m unittest discover -s dopa-quest/tests -p 'test_shan_private_review1211.py' -v

      - name: Check 1,000 Shan source-preserving semantic candidate records
        run: python3 -m unittest discover -s dopa-quest/tests -p 'test_shan_extra_semantic_review.py' -v

      - name: Validate second 1,000 Shan semantic review candidates
        run: python3 -m unittest discover -s dopa-quest/tests -p 'test_shan_extra_semantic_review_batch2.py' -v

      - name: Validate third 1,000 Shan semantic review records
        run: python3 -m unittest discover -s dopa-quest/tests -p 'test_shan_extra_semantic_review_batch3.py' -v

      - name: Validate fourth Shan semantic review batch (1,000 source parents)
        run: python3 -m unittest discover -s dopa-quest/tests -p 'test_shan_extra_semantic_review_batch4.py' -v

      - name: Validate fifth Shan semantic review batch (1,000 source parents)
        run: python3 -m unittest discover -s dopa-quest/tests -p 'test_shan_extra_semantic_review_batch5.py' -v

      - name: Validate sixth Shan semantic review batch (1,000 parents across packs)
        run: python3 -m unittest discover -s dopa-quest/tests -p 'test_shan_extra_semantic_review_batch6.py' -v

      - name: Validate seventh Shan semantic review batch (1,000 parents)
        run: python3 -m unittest discover -s dopa-quest/tests -p 'test_shan_extra_semantic_review_batch7.py' -v

      - name: Validate eighth Shan semantic review batch (1,000 parents)
        run: python3 -m unittest discover -s dopa-quest/tests -p 'test_shan_extra_semantic_review_batch8.py' -v

      - name: Validate ninth Shan semantic review batch (1,000 parents)
        run: python3 -m unittest discover -s dopa-quest/tests -p 'test_shan_extra_semantic_review_batch9.py' -v

      - name: Validate tenth Shan semantic review batch (1,000 parents)
        run: python3 -m unittest discover -s dopa-quest/tests -p 'test_shan_extra_semantic_review_batch10.py' -v

      - name: Validate eleventh Shan semantic review batch (1,000 parents)
        run: python3 -m unittest discover -s dopa-quest/tests -p 'test_shan_extra_semantic_review_batch11.py' -v

      - name: Validate twelfth Shan semantic review batch (505 parents)
        run: python3 -m unittest discover -s dopa-quest/tests -p 'test_shan_extra_semantic_review_batch12.py' -v

      - name: Verify Shan single-category release safety and provenance
        run: |
          node --check dopa-quest/shan-extra-provisional.js
          node --check dopa-quest/bootstrap.js
          node --check dopa-quest/game.js
          node --check dopa-quest/vocabulary-ui.js
          node --test dopa-quest/tests/shan-extra-single-proposals.test.mjs
      - name: Verify all 637 Shan multi-category conflict triage records
        run: node --test dopa-quest/tests/shan-extra-multiple-review.test.mjs
      - name: Verify second-pass Shan multiple-category candidates and 65 held records
        run: node --test dopa-quest/tests/shan-extra-multiple-round2.test.mjs
      - name: Verify Shan multi-cue provisional release safety and 4,931 total proposals
        run: |
          node --check dopa-quest/shan-extra-provisional.js
          node --test dopa-quest/tests/shan-extra-multiple-proposals-release.test.mjs

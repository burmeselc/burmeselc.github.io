name: DOPA QUEST quality checks
on:
  pull_request:
    paths:
      - 'dopa-quest/**'
      - '.github/workflows/dopa-quality.yml'
  push:
    branches:
      - main
    paths:
      - 'dopa-quest/**'
      - '.github/workflows/dopa-quality.yml'
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check dopa-quest/game.js
      - run: node --check dopa-quest/bootstrap.js
      - run: node --check dopa-quest/cloud-sync.js
      - run: node --test dopa-quest/tests/quality.test.mjs
      - run: node --test dopa-quest/tests/pwa.test.mjs
      - run: node --check dopa-quest/service-worker.js
      - name: Check incoming Shan CSV audit is read-only and lossless
        run: python3 -m unittest discover -s dopa-quest/tests -p 'test_additional_shan_audit.py' -v

      - name: Verify Shan master ledger provenance and source parsing
        run: python3 -m unittest discover -s dopa-quest/tests -p 'test_shan_master_ledger.py' -v

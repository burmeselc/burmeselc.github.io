name: Thai ALA-LC tool checks
on:
  pull_request:
    paths:
      - "thai-alalc/**"
      - ".github/workflows/thai-alalc-tests.yml"
  push:
    branches:
      - "feature/thai-alalc-dictionary"
    paths:
      - "thai-alalc/**"
      - ".github/workflows/thai-alalc-tests.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTML parser
        run: python -m pip install beautifulsoup4
      - name: Python tests
        run: python -m unittest discover -s thai-alalc/tests -v
      - name: JavaScript syntax
        run: node --check thai-alalc/app.js
      - name: Validate data
        run: |
          python - <<'PY'
          import json
          with open('thai-alalc/dictionary.json', encoding='utf-8') as f: rows=json.load(f)
          assert len(rows)>=25
          assert all(set(('thai','alalc','meaning','source','status'))<=set(r) for r in rows)
          print('Dictionary schema OK:',len(rows),'records')
          PY

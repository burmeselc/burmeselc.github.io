name: SEAlang Thai volume probe
on:
  push:
    branches: [feature/thai-sealang-scale]
    paths: ['.github/workflows/sealang-volume-probe.yml']
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Fetch single common Thai character class
        working-directory: thai-alalc
        run: |
          python - <<'PY'
          import ssl,urllib.parse,urllib.request,re
          from bs4 import BeautifulSoup
          q=urllib.parse.urlencode({'service':'dictionary','lang':'Thai','query':'กก.*'})
          req=urllib.request.Request('https://sealang.net/api/api.pl?'+q,headers={'User-Agent':'ThaiALALC-AcademicLexicon/0.2'})
          with urllib.request.urlopen(req,timeout=35,context=ssl._create_unverified_context()) as r:
              body=r.read(300000)
              print('status',r.status,'read_bytes',len(body))
          soup=BeautifulSoup(body,'html.parser')
          for x in soup(['script','style']):x.decompose()
          text=soup.get_text(' ',strip=True)
          print('BODY_PREVIEW',text[:1300])
          print('BODY_END',text[-600:])
          print('ENTRY_TAGS',len(soup.find_all(['entry','subentry'])))
          PY
      - name: Validate
        run: python -m unittest discover -s thai-alalc/tests -v
      - name: Save tested source records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thai-alalc/data/sealang-shards/ thai-alalc/dictionary.json
          git diff --cached --quiet || (git commit -m 'Test one common Thai-character dictionary batch' && git push origin HEAD:feature/thai-sealang-scale)

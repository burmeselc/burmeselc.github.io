name: SEAlang Thai volume probe
on:
  push:
    branches: [feature/thai-sealang-scale]
    paths: ['.github/workflows/sealang-volume-probe.yml']
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Fetch single common Thai character class
        working-directory: thai-alalc
        run: |
          python scripts/sealang_api_thai.py --queries 'ก.*' --limit 1 --delay 12 --legacy-tls --run --permission-confirmed
          python scripts/build_dictionary.py --source data/sealang-shards/
      - name: Validate
        run: python -m unittest discover -s thai-alalc/tests -v
      - name: Save tested source records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thai-alalc/data/sealang-shards/ thai-alalc/dictionary.json
          git diff --cached --quiet || (git commit -m 'Test one common Thai-character dictionary batch' && git push origin HEAD:feature/thai-sealang-scale)

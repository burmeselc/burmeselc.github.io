name: Import SEAlang Thai dictionary
on:
  workflow_dispatch:
    inputs:
      query_patterns:
        description: "Space-separated Thai search patterns: ก.* ข.* ค.*"
        type: string
        required: true
      max_requests:
        description: "Maximum requests in this batch (up to 60)"
        type: number
        default: 12
        required: true
      bulk_access_permitted:
        description: "I confirm SEAlang permitted academic bulk retrieval"
        type: boolean
        required: true
        default: false
      redistribution_permitted:
        description: "I confirm SEAlang permitted redistribution"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  import:
    if: inputs.bulk_access_permitted && inputs.redistribution_permitted
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      QUERIES: ${{ inputs.query_patterns }}
      MAX_REQUESTS: ${{ inputs.max_requests }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install beautifulsoup4
      - name: Fetch approved SEAlang search results
        working-directory: thai-alalc
        run: |
          read -r -a query_list <<< "$QUERIES"
          python scripts/sealang_api_thai.py --queries "${query_list[@]}" --limit "$MAX_REQUESTS" --delay 20 --legacy-tls --run --permission-confirmed
          python scripts/build_dictionary.py --source data/sealang-shards/
          python - <<'PY'
          import csv,glob,json
          paths=glob.glob('data/sealang-shards/*.csv')
          records=sum(sum(1 for _ in csv.DictReader(open(p,encoding='utf-8'))) for p in paths)
          rows=json.load(open('dictionary.json',encoding='utf-8'))
          print('SEAlang source records:',records,'published dictionary entries:',len(rows))
          if not records: raise SystemExit('No source records; aborting publication.')
          PY
      - name: Validate
        run: |
          python -m unittest discover -s thai-alalc/tests -v
          node --check thai-alalc/app.js
      - name: Commit source shards and the derived dictionary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thai-alalc/data/sealang-shards/ thai-alalc/dictionary.json
          if git diff --cached --quiet; then
            echo 'No new dictionary entries'
          else
            git commit -m 'Update Thai ALA-LC dictionary from SEAlang API'
            git push
          fi

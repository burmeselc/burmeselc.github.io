name: Thai SEAlang dictionary import (permission-confirmed)
on:
  workflow_dispatch:
    inputs:
      queries:
        description: "Optional semicolon-delimited queries, e.g. ก.*;ข.* (leave empty for initial-letter partition)"
        required: false
        type: string
        default: ""
      max_requests:
        description: "Maximum number of searches this run (1 to 100)"
        required: true
        type: number
        default: 20
      bulk_access_permitted:
        description: "I have permission for SEAlang Thai batch retrieval"
        type: boolean
        required: true
        default: false
      redistribution_permitted:
        description: "I have permission to publish the retrieved lexical content"
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  import:
    if: inputs.bulk_access_permitted && inputs.redistribution_permitted
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write
    env:
      QUERIES: ${{ inputs.queries }}
      MAX_REQUESTS: ${{ inputs.max_requests }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install beautifulsoup4
      - name: Download SEAlang Thai API searches at allowed crawl interval
        working-directory: thai-alalc
        run: |
          python scripts/sealang_batch.py --run --permission-confirmed \
            --queries "$QUERIES" --max-requests "$MAX_REQUESTS" --delay 20
      - name: Extract records and build dictionary
        working-directory: thai-alalc
        run: |
          python scripts/sealang_batch.py --parse-only
          python - <<'PY'
          import csv
          with open('data/sealang-export.csv',encoding='utf-8') as f:
              count=sum(1 for _ in csv.DictReader(f))
          if count<1:raise SystemExit('No records extracted; declining publish.')
          print('Extracted records:',count)
          PY
          python scripts/build_dictionary.py --source data/sealang-export.csv
      - name: Validate generated data
        run: |
          python -m unittest discover -s thai-alalc/tests -v
          node --check thai-alalc/app.js
          python - <<'PY'
          import json
          data=json.load(open('thai-alalc/dictionary.json',encoding='utf-8'))
          assert data and all('thai' in d and 'meaning' in d and 'source' in d and 'status' in d for d in data)
          print('Validated',len(data),'dictionary records')
          PY
      - name: Commit verified-source candidate dictionary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thai-alalc/dictionary.json
          if git diff --cached --quiet; then
            echo "No dictionary changes"
          else
            git commit -m "Update Thai ALA-LC dictionary from SEAlang API"
            git push
          fi

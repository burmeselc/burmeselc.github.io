name: Thai SEAlang one-query import test
on:
  push:
    branches: ["feature/sealang-thai-import"]
    paths: [".github/workflows/thai-sealang-sample.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install beautifulsoup4
      - name: Collect and extract one permitted API query
        working-directory: thai-alalc
        run: |
          python scripts/sealang_batch.py --run --permission-confirmed --queries "ภาษา" --max-requests 1 --delay 20
          python scripts/sealang_batch.py --parse-only
          python - <<'PY'
          import csv
          with open('data/sealang-export.csv',encoding='utf-8') as f:rows=list(csv.DictReader(f))
          print('EXTRACTED ROWS',len(rows))
          assert any(x['thai']=='ภาษา' for x in rows),'Expected ภาษา in dictionary response'
          for x in [x for x in rows if x['thai']=='ภาษา'][:2]:print('EXAMPLE',x)
          PY
          python scripts/build_dictionary.py --source data/sealang-export.csv --out /tmp/sample-thai-dictionary.json
          python - <<'PY'
          import json
          items=json.load(open('/tmp/sample-thai-dictionary.json',encoding='utf-8'))
          print('BUILT ENTRIES',len(items))
          assert any(x['thai']=='ภาษา' for x in items)
          PY
